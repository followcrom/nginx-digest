[project]
name = "nginx-digest"
version = "0.1.0"
description = "Parses nginx access logs, generates visitor analytics with geolocation data, gets LLM commentary, and sends a daily email digest."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geoip2>=5.2.0",
    "llm>=0.28",
    "llm-deepseek>=0.1.6",
    "python-dotenv>=1.0.0",
]
